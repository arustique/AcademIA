<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademIA</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="dashboard.html" class="brand"><span class="dot"></span>AcademIA</a>
    <div class="nav-links">
      <a href="dashboard.html">← Retour à la bibliothèque</a>
    </div>
  </div>
</nav>

<div class="container section--tight" style="max-width:820px;">
  <div id="content">
    <p style="color:var(--muted)">Chargement du guide…</p>
  </div>
</div>

<footer class="footer"><div class="container">AcademIA — un programme de Rustique AKODOGBO.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const session = await requireSession();
  if (!session) return;

  const slug = new URLSearchParams(location.search).get("slug");
  const el = document.getElementById("content");
  if (!slug) { el.innerHTML = "<p>Guide introuvable.</p>"; return; }

  const { data: mod, error: modErr } = await sb.from("modules").select("*").eq("slug", slug).single();
  if (modErr || !mod) { el.innerHTML = "<p>Guide introuvable.</p>"; return; }

  const { data: contentRow, error: contentErr } = await sb
    .from("module_content").select("blocks").eq("module_id", mod.id).single();

  if (contentErr || !contentRow) {
    // La RLS bloque l'accès si le guide est payant et le compte non débloqué
    el.innerHTML = `
      <div class="paywall">
        <span class="eyebrow">Guide verrouillé</span>
        <h2 style="color:#fff;">${esc(mod.title)}</h2>
        <p style="color:rgba(255,255,255,.75);">Ce guide fait partie de l'accès complet AcademIA.</p>
        <a href="unlock.html" class="btn btn--gold" style="margin-top:14px;">Débloquer pour ${window.ACADEMIA_CONFIG.PRICE_LABEL}</a>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="module-header">
      <span class="eyebrow">Guide ${esc(mod.num)}</span>
      <h1>${esc(mod.title)}</h1>
      <div class="sub">${esc(mod.subtitle || "")}</div>
      <div class="platforms"><b>PLATEFORMES</b> &nbsp;${esc(mod.platforms || "")}</div>
    </div>
    <div class="module-body">${renderBlocks(contentRow.blocks)}</div>
  `;
})();
</script>
</body>
</html>
